#### General ####
set -g mouse on
set -g history-limit 10000
set -g base-index 1                  # 0 is too far
set -s escape-time 0                 # No delay for escape key press
set -g focus-events on
set -s set-clipboard on
set-window-option -g mode-keys vi
set-window-option -g aggressive-resize off

#### Terminal ####
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -sa terminal-features ',xterm-256color:RGB'

#### Prefix ####
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

#### Window naming & status ####
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{pane_current_command}'

#### Appearance ####
set-option -g pane-border-style bg=default
set-option -g pane-active-border-style bg=default

#### Key bindings ####
# Reload config
bind r source-file ~/.tmux.conf

# Clear scrollback
bind -n C-k clear-history

# Disable right-click pane menu
unbind -n MouseDown3Pane

# Splitting
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind e resize-window -A

# New windows open in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# Switch layout (Shift-Down/Up now jump between workspaces; prefix+Space cycles layouts)
bind Space next-layout

# Panes: Ctrl-arrows (no prefix) to switch
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Panes: prefix + vim keys to switch
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# Panes: Ctrl-Alt-arrows to swap; prefix+z zooms
bind-key -n C-M-Left swap-pane -U
bind-key -n C-M-Right swap-pane -D
bind z resize-pane -Z

# Windows: Shift-arrows to switch, in workspace-tree order (tmux-git-workspaces)
set -g @workspaces-next-key 'S-Right'
set -g @workspaces-prev-key 'S-Left'
# Shift-Down / Shift-Up: jump to the next / previous workspace (repo)
set -g @workspaces-next-ws-key 'S-Down'
set -g @workspaces-prev-ws-key 'S-Up'

# Windows: Ctrl-Shift-arrows to move
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

#### Plugins ####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
# Status bar theme, then the workspace plugin (the theme must come first: the
# plugin wraps the theme's window formats)
set -g @plugin 'junousia/tmux-axolotl'
set -g @axolotl-scheme 'kanagawa-dragon'
set -g @axolotl-numbers 'off'
set -g @plugin 'junousia/tmux-git-workspaces'

run '~/.tmux/plugins/tpm/tpm'
