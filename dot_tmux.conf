#### General ####
set -g mouse on
set -g history-limit 10000
set -g base-index 1                  # 0 is too far
set -s escape-time 0                 # No delay for escape key press
set -g focus-events on
set -s set-clipboard off
set-window-option -g mode-keys vi
set-window-option -g aggressive-resize off

#### Terminal ####
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -sa terminal-features ',xterm-256color:RGB'

#### Prefix ####
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

#### Window naming & status ####
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

#### Appearance ####
set-option -g pane-border-style bg=default
set-option -g pane-active-border-style bg=default

#### Key bindings ####
# Reload config
bind r source-file ~/.tmux.conf

# Clear scrollback
bind -n C-k clear-history

# Disable right-click pane menu
unbind -n MouseDown3Pane

# Splitting
bind-key v split-window -h
bind-key s split-window -v
bind | split-window -h
bind - split-window -v
bind e resize-window -A

# Switch layout
bind -n S-Down next-layout

# Panes: Ctrl-arrows (no prefix) to switch
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Panes: prefix + vim keys to switch
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# Panes: Ctrl-Alt-arrows to swap, Shift-Up to zoom
bind-key -n C-M-Left swap-pane -U
bind-key -n C-M-Right swap-pane -D
bind -n S-Up resize-pane -Z

# Windows: Shift-arrows to switch
bind -n S-Left previous-window
bind -n S-Right next-window

# Windows: Ctrl-Shift-arrows to move
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

#### Plugins ####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin '2kabhishek/tmux2k'

# tmux2k
set -g @tmux2k-theme 'gruvbox'
set -g @tmux2k-catppuccin-bg default
set -g @tmux2k-left-plugins nil
set -g @tmux2k-right-plugins ''
set -g @tmux2k-show-powerline true
set -g @tmux2k-icons-only false
set -g @tmux2k-window-list-alignment 'left'
set -g @tmux2k-window-list-compact true
set -g @tmux2k-window-list-format '#W'

run '~/.tmux/plugins/tpm/tpm'

# Must come after tpm so it overrides the plugin's status-right
set -g status-right ''
